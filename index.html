<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Warung COGS — Kalkulator HPP &amp; Kasir Restoran</title>
<meta name="theme-color" content="#153f30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kasir Cafe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<style>
:root{
  --green:#15694b; --green-dark:#0d3d2d; --green-deep:#0a2f23; --green-light:#e6f3ec;
  --amber:#efa63f; --amber-dark:#c9821c;
  --bg:#f1f4f0; --card:#ffffff; --ink:#16241d; --muted:#617168;
  --line:#e1e7e1; --danger:#c0392b; --danger-bg:#fdecea;
  --radius:16px; --shadow:0 1px 2px rgba(14,36,26,.05),0 8px 28px rgba(14,36,26,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{line-height:1.25}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:232px;background:linear-gradient(180deg,var(--green-dark),var(--green-deep));color:#dfece6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .logo{font-size:26px}
.brand .name{font-weight:700;font-size:16px;color:#fff;margin-top:4px;word-break:break-word}
.brand .tag{font-size:11.5px;color:#9dbcae;margin-top:2px}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:4px;background:none;border:0;border-radius:10px;color:#c4d8cd;font-size:14px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.active{background:var(--amber);color:#2a1f08;font-weight:700}
.nav .sep{margin:12px 12px 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7fa392}
.rolebox{padding:14px;border-top:1px solid rgba(255,255,255,.09)}
.rolechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#31614e;color:#dff3e9;margin-bottom:8px}
.rolechip.admin{background:var(--amber);color:#2a1f08}
.rolebox button{width:100%;padding:8px;border:1px solid rgba(255,255,255,.25);background:none;border-radius:9px;color:#e6f2ec;font-size:13px;font-weight:600}
.rolebox button:hover{background:rgba(255,255,255,.1)}
.main{flex:1;min-width:0;padding:24px clamp(14px,3vw,36px) 60px}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.pagehead h1{font-size:22px;font-weight:800}
.pagehead .sub{width:100%;color:var(--muted);font-size:13.5px}
.pagehead .spacer{flex:1}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 18px;border-top:3px solid var(--green)}
.stat .lab{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-size:21px;font-weight:800;margin-top:2px;color:var(--green-dark);letter-spacing:-.01em}
.stat .note{font-size:11.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink);transition:background .15s,transform .08s,box-shadow .15s}
.btn:hover{background:#f2f5f2}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(180deg,#1a7b58,var(--green));border-color:var(--green);color:#fff;box-shadow:0 2px 8px rgba(21,105,75,.3)}
.btn-primary:hover{background:var(--green-dark)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#2a1f08}
.btn-amber:hover{background:var(--amber-dark);color:#fff}
.btn-danger{background:var(--danger-bg);border-color:#f0c4bd;color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:var(--green)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.frow{display:grid;gap:12px}
.frow.c2{grid-template-columns:1fr 1fr}
.frow.c3{grid-template-columns:1fr 1fr 1fr}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:var(--green-light);color:var(--green-dark);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:nth-child(even) td{background:#fafcfa}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--green-light);color:var(--green-dark)}
.pill.amber{background:#fdf2df;color:var(--amber-dark)}
.pill.gray{background:#eef1ee;color:var(--muted)}
.pill.red{background:var(--danger-bg);color:var(--danger)}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.searchbar input,.searchbar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.searchbar input{flex:1;min-width:160px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,30,23,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;padding:22px;animation:pop .18s ease}
.modal.wide{max-width:760px}
.modal.narrow{max-width:380px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:17px;font-weight:800;margin-bottom:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* kasir */
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prodcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(14,36,26,.04);transition:transform .08s,border-color .12s,box-shadow .15s}
.prodcard:hover{border-color:var(--green);transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,36,26,.1)}
.prodcard:active{transform:scale(.97)}
.prodcard .pn{font-weight:700;font-size:13.5px;line-height:1.3}
.prodcard .pc{font-size:11px;color:var(--muted);margin:2px 0 6px}
.prodcard .pp{font-weight:800;color:var(--green);font-size:14px}
.cart{position:sticky;top:16px}
.cartitems{max-height:44vh;overflow-y:auto;margin-bottom:10px}
.citem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.citem .cn{flex:1;min-width:0}
.citem .cn b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .cn span{font-size:11.5px;color:var(--muted)}
.qtybtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800;line-height:1}
.citem .qv{width:26px;text-align:center;font-weight:700;font-size:13.5px}
.citem .amt{font-weight:700;font-size:13px;width:80px;text-align:right;font-variant-numeric:tabular-nums}
.totrow{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}
.totrow.grand{font-size:17px;font-weight:800;color:var(--green);border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}

/* receipt / print */
.receipt{font-family:"Courier New",monospace;font-size:12.5px;background:#fff;color:#000;width:300px;margin:0 auto;padding:14px}
.receipt .c{text-align:center}
.receipt .rname{font-size:15px;font-weight:800}
.receipt hr{border:0;border-top:1px dashed #000;margin:7px 0}
.receipt table{min-width:0;font-size:12px}
.receipt td,.receipt th{padding:2px 0;border:0;background:#fff!important}
.receipt .rrow{display:flex;justify-content:space-between}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%}
}

/* lencana status sinkronisasi cloud */
.syncdot{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);color:#b9cfc4;cursor:default}
.syncdot.on{background:var(--green-light);color:var(--green-dark)}
.syncdot.err{background:var(--danger-bg);color:var(--danger)}

/* mobile top bar & floating cart button (hidden on desktop) */
.mtop{display:none}
.cartfab{display:none}
.mclose{display:none}

/* responsive */
@media(max-width:980px) and (min-width:821px){
  .pos{grid-template-columns:1fr}
  .cart{position:static}
}
/* ---------- tata letak HP: app-like ---------- */
@media(max-width:820px){
  body{font-size:14.5px}
  .app{flex-direction:column}

  /* header atas ramping */
  .mtop{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:40;
    background:var(--green-dark);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .mtop .mlogo{font-size:20px}
  .mtop .mname{flex:1;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop .rolechip{margin:0}
  .mtop button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:9px;padding:6px 10px;font-size:15px}

  /* navigasi pindah ke bawah, seperti aplikasi native */
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;z-index:40;
    flex-direction:row;box-shadow:0 -3px 14px rgba(0,0,0,.25)}
  .brand,.rolebox,.nav .sep{display:none}
  .nav{display:flex;flex:1;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav button{flex:1;min-width:56px;flex-direction:column;gap:2px;margin:0 2px;padding:7px 2px;
    font-size:10px;font-weight:600;white-space:nowrap;text-align:center;align-items:center;justify-content:center;border-radius:12px}
  .nav button .nico{font-size:19px;line-height:1}

  .main{padding:14px 12px 150px}
  .pagehead h1{font-size:18px}
  .pagehead .sub{font-size:12.5px}
  .card{padding:14px;border-radius:12px}
  .grid.stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat .val{font-size:17px}
  .frow.c2,.frow.c3{grid-template-columns:1fr}

  /* cegah zoom otomatis iOS & target sentuh besar */
  input,select,textarea{font-size:16px}
  .btn{padding:11px 16px}
  .btn-sm{padding:8px 11px;font-size:13px}
  .qtybtn{width:34px;height:34px;border-radius:10px}

  /* tabel muat layar: kolom sekunder disembunyikan, tanpa geser horizontal */
  .hide-m{display:none!important}
  .tablewrap table{min-width:0!important;font-size:12.5px}
  th,td{padding:8px 8px}

  /* kasir: grid produk 2 kolom, keranjang jadi panel bawah */
  .pos{grid-template-columns:1fr}
  .prodgrid{grid-template-columns:repeat(2,1fr)}
  .prodcard{padding:12px 10px}
  .cart{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:46;margin:0;
    border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;box-shadow:0 -10px 34px rgba(0,0,0,.35);
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .cart.open{display:block}
  .cartitems{max-height:26vh}
  .mclose{display:inline-flex}

  /* tombol keranjang melayang */
  .cartfab{display:flex;justify-content:space-between;align-items:center;gap:10px;position:fixed;
    left:14px;right:14px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:44;
    background:var(--green);color:#fff;border:0;border-radius:14px;padding:13px 18px;
    font-weight:800;font-size:14.5px;box-shadow:0 6px 20px rgba(20,60,40,.4)}

  /* modal jadi lembar bawah */
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
    padding-bottom:calc(22px + env(safe-area-inset-bottom))}

  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>

<header class="mtop">
  <span class="mlogo">🍽️</span>
  <div class="mname" id="brandNameM">Warung COGS <small style="opacity:.65;font-size:10px;font-weight:600">v4</small></div>
  <span class="syncdot off" id="syncDotM" title="Status sinkronisasi">☁️</span>
  <span class="rolechip" id="roleChipM">Kasir</span>

<div class="app" id="appRoot">
  <aside class="sidebar">

<div id="printArea"></div>

<script>
'use strict';
/* =====================================================================
   Warung COGS — aplikasi kalkulator HPP (COGS) & kasir untuk restoran.
   Satu file, offline, data tersimpan di IndexedDB perangkat ini.
   Rumus mengikuti Excel:
     unit cost   = harga beli / isi kemasan
     biaya bahan = Σ (qty per porsi × unit cost)
     overhead    = gaji/porsi + utilitas/porsi   (porsi = produksi bulanan)
     COGS        = bahan + overhead
     harga saran = COGS / (1 - margin)
   ===================================================================== */

/* ---------- util ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = new Intl.NumberFormat('id-ID');
const rp = n => 'Rp ' + fmt.format(Math.round(+n || 0));
const rp2 = n => 'Rp ' + fmt.format(Math.round(((+n || 0) + Number.EPSILON) * 100) / 100);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const round500up = n => Math.ceil(n / 500) * 500;
const dstr = d => { const x = new Date(d); return x.toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}); };
const tstr = d => new Date(d).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'});
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- SHA-256 (WebCrypto + fallback murni JS utk file://) ---------- */
function sha256Sync(str){
  const utf8 = unescape(encodeURIComponent(str));
  const rr = (v,a)=>(v>>>a)|(v<<(32-a));
  const maxWord = Math.pow(2,32);
  let words=[], result='';
  const bitLen = utf8.length*8;
  let hash = sha256Sync.h = sha256Sync.h || [];
  const k = sha256Sync.k = sha256Sync.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for(let candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(let i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter] = (Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++] = (Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  let a = utf8 + '\x80';
  while(a.length % 64 - 56) a += '\x00';
  for(let i=0;i<a.length;i++){
    const j = a.charCodeAt(i);
    words[i>>2] |= j << ((3-i)%4)*8;
  }
  words[words.length] = (bitLen/maxWord)|0;
  words[words.length] = bitLen;
  for(let j=0;j<words.length;){
    const w = words.slice(j, j+=16);
    const oldHash = hash.slice(0,8);
    hash = hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15 = w[i-15], w2 = w[i-2];
      const a0 = hash[0], e0 = hash[4];
      const temp1 = hash[7]
        + (rr(e0,6)^rr(e0,11)^rr(e0,25))
        + ((e0&hash[5])^((~e0)&hash[6]))
        + k[i]
        + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2 = (rr(a0,2)^rr(a0,13)^rr(a0,22)) + ((a0&hash[1])^(a0&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1+temp2)|0].concat(hash);
      hash[4] = (hash[4]+temp1)|0;
    }
    for(let i=0;i<8;i++) hash[i] = (hash[i]+oldHash[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){
    const b = (hash[i]>>(j*8))&255;
    result += ((b<16)?'0':'') + b.toString(16);
  }
  return result;
}
async function sha256(str){
  try{
    if(crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){/* file:// di sebagian browser */}
  return sha256Sync(str);
}

/* ---------- penyimpanan (IndexedDB, fallback localStorage) ---------- */
const DB_NAME = 'warungCogsDB';
let _db = null, _useLS = false;
function dbOpen(){
  return new Promise((res)=>{
    if(!window.indexedDB){ _useLS = true; return res(null); }
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('invoices')) d.createObjectStore('invoices', {keyPath:'id'});
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => { _useLS = true; res(null); };
  });
}
function kvSet(key, val){
  if(_useLS){ try{ localStorage.setItem('wc_'+key, JSON.stringify(val)); }catch(e){ toast('⚠️ Penyimpanan penuh!'); } return Promise.resolve(); }
  return new Promise((res,rej)=>{
    const tx = _db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
function kvGet(key){
  if(_useLS){ try{ return Promise.resolve(JSON.parse(localStorage.getItem('wc_'+key))); }catch(e){ return Promise.resolve(null); } }
  return new Promise((res,rej)=>{
    const rq = _db.transaction('kv').objectStore('kv').get(key);
    rq.onsuccess = ()=>res(rq.result ?? null); rq.onerror = ()=>rej(rq.error);
  });
}
function invPut(inv){
  if(_useLS){ const all = lsInv(); const i = all.findIndex(x=>x.id===inv.id); i>=0 ? all[i]=inv : all.push(inv); try{ localStorage.setItem('wc_invoices', JSON.stringify(all)); }catch(e){ toast('⚠️ Penyimpanan penuh!'); } return Promise.resolve(); }
  return new Promise((res,rej)=>{
    const tx = _db.transaction('invoices','readwrite');
    tx.objectStore('invoices').put(inv);
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
function invDel(id){
  if(_useLS){ localStorage.setItem('wc_invoices', JSON.stringify(lsInv().filter(x=>x.id!==id))); return Promise.resolve(); }
  return new Promise((res,rej)=>{
    const tx = _db.transaction('invoices','readwrite');
    tx.objectStore('invoices').delete(id);
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
function invAll(){
  if(_useLS) return Promise.resolve(lsInv());
  return new Promise((res,rej)=>{
    const rq = _db.transaction('invoices').objectStore('invoices').getAll();
    rq.onsuccess = ()=>res(rq.result||[]); rq.onerror = ()=>rej(rq.error);
  });
}
function invClear(){
  if(_useLS){ localStorage.removeItem('wc_invoices'); return Promise.resolve(); }
  return new Promise((res,rej)=>{
    const tx = _db.transaction('invoices','readwrite');
    tx.objectStore('invoices').clear();
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
function lsInv(){ try{ return JSON.parse(localStorage.getItem('wc_invoices'))||[]; }catch(e){ return []; } }

/* ---------- sinkronisasi antar perangkat (Firebase Firestore) ----------
   Data disimpan di akun Firebase milik pemilik usaha sendiri. Semua
   perangkat dengan ID Toko yang sama saling terhubung real-time, sehingga
   pemilik bisa memantau input kasir dari mana saja. Panduan pembuatan
   akun: PANDUAN_SINKRONISASI.md */
const SYNC = { db:null, on:false, state:'off', timers:{} };
const SYNCED_SETTINGS = ['cafeName','address','phone','receiptNote','taxPct','maxDiscKasir','pinHash'];
const kvPath  = id => `stores/${S.settings.sync.storeId}/kv/${id}`;
const invPath = id => `stores/${S.settings.sync.storeId}/invoices/${id}`;
function setSyncBadge(state, msg){
  SYNC.state = state;
  const label = state==='on' ? '☁️ Tersinkron' : state==='err' ? '☁️ Gagal' : '☁️ Lokal';
  const d1 = document.getElementById('syncDot');
  const d2 = document.getElementById('syncDotM');
  if(d1){ d1.className = 'syncdot ' + state; d1.textContent = label; d1.title = msg || label; }
  if(d2){ d2.className = 'syncdot ' + state; d2.textContent = '☁️'; d2.title = msg || label; }
  const st = document.getElementById('syStatus');
  if(st) st.textContent = msg || label;
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('tidak bisa memuat '+src+' — periksa koneksi internet')); document.head.appendChild(s); }); }
async function syncInit(){
  const sy = S.settings.sync || {};
  if(!sy.enabled || !sy.apiKey || !sy.projectId || !sy.storeId){ SYNC.on=false; setSyncBadge('off'); return; }
  try{
    setSyncBadge('off', '☁️ Menyambungkan…');
    if(!window.firebase){
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length) firebase.initializeApp({ apiKey:sy.apiKey, authDomain:sy.projectId+'.firebaseapp.com', projectId:sy.projectId });
    SYNC.db = firebase.firestore();
    try{ await SYNC.db.enablePersistence({synchronizeTabs:true}); }catch(e){/* tab lain sudah memegang */}
    SYNC.on = true;
    // perangkat pertama yang tersambung mengunggah data lokalnya ke cloud
    const probe = await SYNC.db.doc(kvPath('materials')).get();
    if(!probe.exists) await pushAllToCloud();
    listenCloud();
    setSyncBadge('on');
  }catch(err){
    SYNC.on = false;
    setSyncBadge('err', '☁️ Gagal: ' + err.message);
    toast('☁️ Sinkronisasi gagal: ' + err.message);
  }
}
function queueSync(id){
  if(!SYNC.on) return;
  clearTimeout(SYNC.timers[id]);
  SYNC.timers[id] = setTimeout(()=>pushKV(id), 700);
}
function pushKV(id){
  if(!SYNC.on) return;
  let data;
  if(id==='materials') data = S.materials;
  else if(id==='products') data = S.products;
  else if(id==='overhead') data = S.overhead;
  else if(id==='settings'){ data = {}; for(const k of SYNCED_SETTINGS) data[k] = S.settings[k] ?? null; }
  SYNC.db.doc(kvPath(id)).set({ j: JSON.stringify(data), dev: S.settings.deviceId, at: Date.now() })
    .then(()=>setSyncBadge('on'))
    .catch(e=>setSyncBadge('err', '☁️ Gagal kirim: ' + e.message));
}
function pushInvoice(inv){
  if(!SYNC.on) return;
  SYNC.db.doc(invPath(inv.id)).set({ j: JSON.stringify(inv), dev: S.settings.deviceId, at: Date.now() })
    .then(()=>setSyncBadge('on'))
    .catch(e=>setSyncBadge('err', '☁️ Gagal kirim: ' + e.message));
}
function deleteInvoiceCloud(id){
  if(!SYNC.on) return;
  SYNC.db.doc(invPath(id)).delete().catch(()=>{});
}
async function pushAllToCloud(){
  for(const id of ['materials','products','overhead','settings']) pushKV(id);
  for(const inv of await invAll()) pushInvoice(inv);
}
async function wipeCloud(){
  if(!SYNC.on) return;
  try{
    const snap = await SYNC.db.collection(`stores/${S.settings.sync.storeId}/invoices`).get();
    for(const d of snap.docs) await d.ref.delete();
  }catch(e){/* biarkan */}
}
function listenCloud(){
  const sid = S.settings.sync.storeId;
  SYNC.db.collection(`stores/${sid}/kv`).onSnapshot(snap=>{
    let changed = false;
    snap.docChanges().forEach(ch=>{
      const d = ch.doc.data();
      if(!d || d.dev === S.settings.deviceId) return;
      let val; try{ val = JSON.parse(d.j); }catch(e){ return; }
      if(val == null) return;
      const id = ch.doc.id;
      if(id==='materials'){ S.materials = val; kvSet('materials', val); changed = true; }
      else if(id==='products'){ S.products = val; kvSet('products', val); changed = true; }
      else if(id==='overhead'){ S.overhead = val; kvSet('overhead', val); changed = true; }
      else if(id==='settings'){ Object.assign(S.settings, val); kvSet('settings', S.settings); changed = true; }
    });
    if(changed) remoteRefresh();
  }, e=>setSyncBadge('err', '☁️ ' + e.message));
  SYNC.db.collection(`stores/${sid}/invoices`).onSnapshot(snap=>{
    let changed = false;
    snap.docChanges().forEach(ch=>{
      if(ch.type === 'removed'){ invDel(ch.doc.id); changed = true; return; }
      const d = ch.doc.data();
      if(!d || d.dev === S.settings.deviceId) return;
      let inv; try{ inv = JSON.parse(d.j); }catch(e){ return; }
      if(inv && inv.id){ invPut(inv); changed = true; }
    });
    if(changed) remoteRefresh();
  }, e=>setSyncBadge('err', '☁️ ' + e.message));
}
let _rrTimer = null;
function remoteRefresh(){
  clearTimeout(_rrTimer);
  _rrTimer = setTimeout(()=>{
    setSyncBadge('on');
    if($('#overlay').classList.contains('open')) return;          // jangan ganggu saat mengedit
    if(S.tab === 'kasir' && S.cart.length){ drawRecent(); return; } // jangan reset keranjang berjalan
    renderAll();
    toast('🔄 Data diperbarui dari perangkat lain');
  }, 400);
}

/* ---------- perhitungan (rumus Excel) ---------- */
function matUnitCost(m){ return m && m.packageSize > 0 ? m.purchasePrice / m.packageSize : 0; }
function overheadCalc(){
  const o = S.overhead;
  const labor = o.monthlyPortions > 0 ? o.monthlySalary / o.monthlyPortions : 0;
  const utilTotal = (+o.electricity||0) + (+o.water||0) + (+o.gas||0) + (+o.other||0);
  const util = o.monthlyPortions > 0 ? utilTotal / o.monthlyPortions : 0;
  return { labor, util, utilTotal, total: labor + util };
}
function productCost(p){
  const oh = overheadCalc();
  let raw = 0;
  if(p.type === 'simple'){ raw = +p.simpleCost || 0; }
  else for(const ing of (p.ingredients||[])){
    const m = S.materials.find(x=>x.id === ing.materialId);
    raw += (+ing.qty||0) * matUnitCost(m);
  }
  const labor = p.includeOverhead ? oh.labor : 0;
  const util  = p.includeOverhead ? oh.util  : 0;
  return { raw, labor, util, total: raw + labor + util };
}
function recommendedPrice(cogs, marginPct){
  const m = (+marginPct||0)/100;
  return m < 1 ? cogs/(1-m) : 0;
}
function invoiceNumber(date){
  const d = new Date(date||Date.now());
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  S.settings.invSeq = S.settings.invSeq || {};
  const seq = (S.settings.invSeq[ymd]||0) + 1;
  S.settings.invSeq[ymd] = seq;
  saveSettings();
  // huruf perangkat mencegah nomor kembar saat beberapa kasir tersinkron
  return `INV-${ymd}-${S.settings.deviceTag||''}${String(seq).padStart(3,'0')}`;
}

function drawProdGrid(q, cat){
  const list = S.products.filter(p => p.active !== false)
    .filter(p => !cat || cat==='Semua' || p.category===cat)
    .filter(p => !q || p.name.toLowerCase().includes(q.toLowerCase()));
  $('#prodGrid').innerHTML = list.length ? list.map(p => `
    <button class="prodcard" data-id="${p.id}">
      <div class="pn">${esc(p.name)}</div>
      <div class="pc">${esc(p.category)}</div>
      <div class="pp">${rp(p.sellPrice)}</div>
    </button>`).join('') : `<div class="empty" style="grid-column:1/-1"><div class="big">🍽️</div>Tidak ada produk. ${isAdmin()?'Tambahkan di menu "Menu, Resep & COGS".':'Minta Admin menambahkan menu.'}</div>`;
  $$('#prodGrid .prodcard').forEach(b => b.onclick = () => addToCart(b.dataset.id));
}
function addToCart(pid){
  const p = S.products.find(x=>x.id===pid); if(!p) return;
  const row = S.cart.find(r=>r.productId===pid);
  if(row) row.qty++;
  else {
    const c = productCost(p);
    S.cart.push({ productId:pid, name:p.name, price:+p.sellPrice||0, cost:c.total, qty:1 });
  }
  drawCart(true);
}
function cartTotals(){
  const subtotal = S.cart.reduce((a,r)=>a+r.price*r.qty, 0);
  let discVal = num($('#discVal') ? $('#discVal').value : S.cartDiscVal);
  const discType = $('#discType') ? $('#discType').value : S.cartDiscType;
  // batasi diskon utk kasir
  const maxPct = isAdmin() ? 100 : (+S.settings.maxDiscKasir||0);
  let discount = discType==='%' ? subtotal*discVal/100 : discVal;
  const cap = subtotal*maxPct/100;
  let capped = false;
  if(discount > cap){ discount = cap; capped = true; }
  if(discount > subtotal) discount = subtotal;
  const taxPct = num($('#taxPct') ? $('#taxPct').value : S.settings.taxPct);
  const tax = (subtotal-discount)*taxPct/100;
  return { subtotal, discount, discType, discVal, taxPct, tax, capped, maxPct, total: subtotal-discount+tax };
}
function drawCart(keep){
  const box = $('#cartItems'); if(!box) return;
  box.innerHTML = S.cart.length ? S.cart.map((r,i)=>`
    <div class="citem">
      <div class="cn"><b>${esc(r.name)}</b><span>${rp(r.price)} × ${r.qty}</span></div>
      <button class="qtybtn" data-i="${i}" data-d="-1">−</button>
      <span class="qv">${r.qty}</span>
      <button class="qtybtn" data-i="${i}" data-d="1">+</button>
      <span class="amt">${rp(r.price*r.qty)}</span>
    </div>`).join('') : '<div class="empty">Keranjang kosong.<br>Klik produk di kiri untuk menambah.</div>';
  $$('#cartItems .qtybtn').forEach(b => b.onclick = () => {
    const r = S.cart[+b.dataset.i]; r.qty += +b.dataset.d;
    if(r.qty<=0) S.cart.splice(+b.dataset.i,1);
    drawCart(true);
  });
  const t = cartTotals();
  $('#cartTotals').innerHTML = `
    <div class="totrow"><span>Subtotal</span><b>${rp(t.subtotal)}</b></div>
    <div class="totrow"><span>Diskon</span><b>− ${rp(t.discount)}</b></div>
    ${t.capped ? `<div class="totrow" style="color:var(--danger);font-size:12px"><span>⚠️ Diskon dibatasi maks. ${t.maxPct}% untuk kasir</span><span>— minta Admin</span></div>` : ''}
    <div class="totrow"><span>Pajak (${t.taxPct||0}%)</span><b>${rp(t.tax)}</b></div>
    <div class="totrow grand"><span>TOTAL</span><span>${rp(t.total)}</span></div>`;
  const fab = $('#cartFab');
  if(fab){
    const n = S.cart.reduce((a,r)=>a+r.qty,0);
    fab.innerHTML = `<span>🛒 ${n ? n+' item' : 'Keranjang kosong'}</span><span>${rp(t.total)} ›</span>`;
  }
  updateChange();
}
function updateChange(){
  const t = cartTotals();
  const paid = num($('#paidAmt') && $('#paidAmt').value);
  $('#changeHint').innerHTML = paid >= t.total && S.cart.length
    ? `Kembalian: <b style="color:var(--green)">${rp(paid - t.total)}</b>`
    : (paid>0 ? `<span style="color:var(--danger)">Kurang ${rp(t.total-paid)}</span>` : '');
}
async function saveInvoice(){
  if(!S.cart.length) return toast('Keranjang masih kosong');
  const t = cartTotals();
  const paid = num($('#paidAmt').value);
  if(paid < t.total) return toast('❌ Uang dibayar kurang dari total');
  const inv = {
    id: uid(), number: invoiceNumber(), date: new Date().toISOString(),
    cashier: isAdmin() ? 'Admin' : 'Kasir', customer: $('#custName').value.trim(),
    items: S.cart.map(r=>({...r})),
    discType: t.discType, discVal: t.discVal, discount: t.discount,
    taxPct: t.taxPct, tax: t.tax, subtotal: t.subtotal, total: t.total,
    paid, change: paid - t.total,
  };
  await invPut(inv);
  pushInvoice(inv);
  S.cart = []; S.cartDiscVal = 0;
  $('.cart').classList.remove('open');
  toast('✅ Invoice ' + inv.number + ' tersimpan');
  showReceipt(inv, true);

  $('#custName').value=''; $('#paidAmt').value='';
}

async function deleteMaterial(id){
  if(!requireAdmin()) return;
  const used = S.products.filter(p => (p.ingredients||[]).some(i=>i.materialId===id));
  const m = S.materials.find(x=>x.id===id);
  const warn = used.length ? `\n\n⚠️ Bahan ini dipakai di ${used.length} resep (${used.map(p=>p.name).join(', ')}). Resep tersebut akan kehilangan bahan ini.` : '';
  if(!confirm(`Hapus bahan "${m.name}"?${warn}`)) return;
  S.materials = S.materials.filter(x=>x.id!==id);
  S.products.forEach(p => p.ingredients = (p.ingredients||[]).filter(i=>i.materialId!==id));
  await saveMaterials(); await saveProducts();
  renderMaterials(); toast('🗑️ Bahan dihapus');
}

  function drawIngs(){
    $('#ingRows').innerHTML = draft.ingredients.length ? draft.ingredients.map((ing,i)=>{
      const m = S.materials.find(x=>x.id===ing.materialId);
      return `<tr>
        <td><select data-mi="${i}" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:8px">${matOptions(ing.materialId)}</select></td>

    syncDraft();
    const c = productCost(draft);
    const rec = recommendedPrice(c.total, draft.marginPct);
    $('#cRaw').textContent = rp2(c.raw);

    drawIngs();
  };
  $('#useRec').onclick = () => { $('#pSell').value = round500up(+($('#pRec').dataset.raw||0)); };

    if(!requireAdmin()) return;

    if(draft.type==='recipe' && !draft.ingredients.length) return toast('Resep butuh minimal 1 bahan');
    const i = S.products.findIndex(x=>x.id===draft.id);
    i >= 0 ? S.products[i] = draft : S.products.push(draft);
    await saveProducts(); closeModal(); renderProducts(); toast('✅ Menu tersimpan');
  };
}
async function deleteProduct(id){
  if(!requireAdmin()) return;
  const p = S.products.find(x=>x.id===id);

async function renderReports(){
  if(!requireAdmin()) return renderAll();
  S.invoices = (await invAll()).sort((a,b)=>b.date.localeCompare(a.date));
  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  const iso = d => d.toISOString().slice(0,10);
  $('#main').innerHTML = `
    <div class="pagehead"><h1>📈 Laporan Penjualan</h1>
      <div class="sub">Semua invoice tersimpan permanen di perangkat ini. Ekspor rutin untuk cadangan.</div></div>
    <div class="searchbar">
      <label style="align-self:center;font-size:13px;font-weight:700;color:var(--muted)">Dari</label>
      <input type="date" id="rFrom" value="${iso(first)}">
      <label style="align-self:center;font-size:13px;font-weight:700;color:var(--muted)">s/d</label>
      <input type="date" id="rTo" value="${iso(today)}">
      <button class="btn btn-amber" id="rCsv">⬇️ Ekspor CSV</button>
    </div>
    <div class="grid stats" id="rStats"></div>
    <div class="tablewrap"><table>
      <tr><th>No. Invoice</th><th>Tanggal</th><th class="hide-m">Kasir</th><th class="hide-m">Pelanggan</th><th class="num hide-m">Item</th><th class="num hide-m">HPP</th><th class="num">Total</th><th class="num hide-m">Laba</th><th>Aksi</th></tr>
      <tbody id="rRows"></tbody>
    </table></div>`;
  const filtered = () => {
    const f = $('#rFrom').value, t = $('#rTo').value;
    return S.invoices.filter(i => {
      const d = i.date.slice(0,10);
      return (!f || d >= f) && (!t || d <= t);
    });
  };
  const draw = () => {
    const list = filtered();
    const omzet = list.reduce((a,i)=>a+i.total,0);
    const hpp = list.reduce((a,i)=>a+i.items.reduce((x,r)=>x+(r.cost||0)*r.qty,0),0);
    const items = list.reduce((a,i)=>a+i.items.reduce((x,r)=>x+r.qty,0),0);
    $('#rStats').innerHTML = `
      <div class="stat"><div class="lab">Transaksi</div><div class="val">${fmt.format(list.length)}</div><div class="note">${fmt.format(items)} item terjual</div></div>
      <div class="stat"><div class="lab">Omzet</div><div class="val">${rp(omzet)}</div></div>
      <div class="stat"><div class="lab">HPP Terjual</div><div class="val">${rp(hpp)}</div></div>
      <div class="stat"><div class="lab">Laba Kotor</div><div class="val">${rp(omzet-hpp)}</div><div class="note">${omzet?Math.round((omzet-hpp)/omzet*100):0}% dari omzet</div></div>`;
    $('#rRows').innerHTML = list.length ? list.map(i=>{
      const c = i.items.reduce((x,r)=>x+(r.cost||0)*r.qty,0);
      return `<tr><td><b>${esc(i.number)}</b></td><td>${dstr(i.date)} ${tstr(i.date)}</td><td class="hide-m">${esc(i.cashier)}</td><td class="hide-m">${esc(i.customer)||'-'}</td>
        <td class="num hide-m">${i.items.reduce((x,r)=>x+r.qty,0)}</td><td class="num hide-m">${rp(c)}</td>
        <td class="num"><b>${rp(i.total)}</b></td><td class="num hide-m">${rp(i.total-c)}</td>
        <td style="white-space:nowrap"><button class="btn btn-sm" data-v="${i.id}">👁️</button>
        <button class="btn btn-sm btn-danger" data-x="${i.id}">🗑️</button></td></tr>`;
    }).join('') : '<tr><td colspan="9" class="empty">Tidak ada transaksi pada rentang tanggal ini.</td></tr>';
    $$('#rRows [data-v]').forEach(b => b.onclick = () => showReceipt(S.invoices.find(x=>x.id===b.dataset.v), true));
    $$('#rRows [data-x]').forEach(b => b.onclick = async () => {
      if(!requireAdmin()) return;
      if(!confirm('Hapus invoice ini dari riwayat?')) return;
      await invDel(b.dataset.x);
      deleteInvoiceCloud(b.dataset.x);
      S.invoices = S.invoices.filter(x=>x.id!==b.dataset.x);
      draw(); toast('🗑️ Invoice dihapus');
    });
  };
  $('#rFrom').onchange = draw; $('#rTo').onchange = draw;
  $('#rCsv').onclick = () => {
    const list = filtered();
    const rows = [['No Invoice','Tanggal','Kasir','Pelanggan','Produk','Qty','Harga','Subtotal','HPP/unit']];
    list.forEach(i => i.items.forEach(r => rows.push([i.number, i.date, i.cashier, i.customer, r.name, r.qty, r.price, r.price*r.qty, r.cost||0])));
    const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    download('laporan-penjualan.csv', '﻿'+csv, 'text/csv');
  };
  draw();
}

    if(p1.length < 4) return toast('PIN baru minimal 4 karakter');
    if(p1 !== p2) return toast('❌ PIN baru tidak sama');

    await saveSettings(); toast('✅ PIN berhasil diganti');

      const data = JSON.parse(await f.text());
      if(data.app !== 'warung-cogs') throw new Error('bukan file backup Warung COGS');
      if(!confirm('Impor akan MENGGANTI seluruh data di perangkat ini dengan isi file backup. Lanjutkan?')) return;
      S.settings = data.settings; S.overhead = data.overhead;

      for(const iv of (data.invoices||[])) await invPut(iv);

  $('#reDemo').onclick = async () => {
    if(!confirm('Muat ulang data demo? Bahan, menu, overhead & contoh invoice akan DIGANTI dengan data demo.')) return;
    await seedDemo(true); renderAll(); toast('🎬 Data demo dimuat');

  $('#wipe').onclick = async () => {
    if(!confirm('HAPUS SEMUA DATA — bahan, menu, invoice, pengaturan? Tindakan ini tidak bisa dibatalkan!')) return;
    if(!confirm('Yakin? Pastikan Anda sudah mengekspor backup.')) return;
    await wipeCloud();
    S.materials = []; S.products = [];
    S.overhead = {monthlySalary:0, monthlyPortions:0, electricity:0, water:0, gas:0, other:0};

    lockToKasir(); toast('🗑️ Semua data dihapus. PIN kembali ke 1234.');
  };
}
function download(name, content, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:mime}));
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

  S.products = await kvGet('products');
  const firstRun = !S.settings;
  if(firstRun){
    S.settings = await freshSettings();
    await seedDemo(true);
    await saveSettings();
  }
  S.materials = S.materials || []; S.products = S.products || [];
  S.overhead = S.overhead || {monthlySalary:0, monthlyPortions:0, electricity:0, water:0, gas:0, other:0};
  // migrasi data lama: pastikan identitas perangkat & wadah sinkronisasi ada
  let migrated = false;
  if(!S.settings.deviceId){ S.settings.deviceId = uid(); migrated = true; }
  if(!S.settings.deviceTag){ S.settings.deviceTag = DEVICE_TAGS[Math.floor(Math.random()*DEVICE_TAGS.length)]; migrated = true; }
  if(!S.settings.sync){ S.settings.sync = { enabled:false, apiKey:'', projectId:'', storeId:'' }; migrated = true; }
  if(migrated) await kvSet('settings', S.settings);
  renderAll();
  syncInit();
  if(firstRun) setTimeout(()=>toast('👋 Selamat datang! Data demo sudah dimuat. PIN Admin: 1234'), 400);
}
init();

/* PWA: daftar service worker agar bisa di-install sebagai aplikasi HP & jalan offline */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
